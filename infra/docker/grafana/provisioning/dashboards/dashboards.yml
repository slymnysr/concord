# Grafana — dashboard'ları dosyadan otomatik yükle
apiVersion: 1

providers:
  - name: concord
    orgId: 1
    folder: Concord
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
