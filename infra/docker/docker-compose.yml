# Concord geliştirme ortamı veritabanları
# Kullanım: docker compose -f infra/docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: concord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord_dev
      POSTGRES_DB: concord
    ports:
      - '5433:5432' # lokal postgres 5432'yi tutuyor, çakışmayı önle
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concord']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # NOT: ScyllaDB kaldırıldı (2026-07). Provisyonlanmıştı ama kod mesajları Postgres'e
  # yazıyordu → atıl + tasarım/kod uyuşmazlığı. Mesaj-ölçek gerçek ihtiyaç olunca
  # (metrikler gösterince) planlı bir faz olarak partition'lı store'a geçilir.
  # Bkz. docs/ROADMAP-FAZLAR.md TIER 4.

  # Virüs tarama — FAZ A internal/media.Scan bu adrese INSTREAM ile bağlanır.
  clamav:
    image: clamav/clamav:latest
    container_name: concord-clamav
    restart: unless-stopped
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s # ilk imza veritabanı indirmesi uzun sürer

  # Metrik toplama — API'nin /metrics endpoint'ini kazır
  prometheus:
    image: prom/prometheus:latest
    container_name: concord-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    # DEV: API host'ta (WSL) çalışıyor. Docker Desktop'ta host.docker.internal VE
    # host-gateway'in ikisi de WINDOWS host'una çıkar → WSL'deki API'ye ULAŞMAZ.
    # Bu yüzden WSL IP'si .env'deki HOST_IP ile verilir (IP reboot'ta değişir, sabitleme!):
    #   echo "HOST_IP=$(hostname -I | awk '{print $1}')" > infra/docker/.env
    # PROD'da API container olur → prometheus.yml hedefi "api:8080" yapılır, bu satır silinir.
    extra_hosts:
      - 'concord-host:${HOST_IP:-host-gateway}'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  # Dashboard — Prometheus'u veri kaynağı olarak otomatik bağlar
  grafana:
    image: grafana/grafana:latest
    container_name: concord-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - '3001:3000' # web :3000'i tuttuğu için 3001
    environment:
      GF_SECURITY_ADMIN_USER: concord
      GF_SECURITY_ADMIN_PASSWORD: concord_dev
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  # Yerel obje deposu (S3 uyumlu) — geliştirmede Cloudflare R2 yerine
  minio:
    image: minio/minio:latest
    container_name: concord-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    # MinIO, ObjectCreated olaylarını host'ta çalışan API'ye POST eder (medya webhook'u).
    # NOT: Docker Desktop/WSL2'de host.docker.internal WINDOWS'u gösterir, WSL dağıtımını
    # DEĞİL → API'ye ulaşmaz. Prometheus'ta aynı tuzağa düşülmüştü; aynı çözüm:
    # HOST_IP=$(ip -4 addr show eth0 | grep -oP 'inet \K[0-9.]+') docker compose up -d
    extra_hosts:
      - 'concord-host:${HOST_IP:-host-gateway}'
    environment:
      MINIO_ROOT_USER: concord
      MINIO_ROOT_PASSWORD: concord_dev_minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # Geliştirme SMTP sunucusu — gönderilen tüm mailler http://localhost:8025 arayüzünde görünür
  mailhog:
    image: mailhog/mailhog:latest
    container_name: concord-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
