apiVersion: v1
kind: Namespace
metadata:
  name: concord
  labels:
    app.kubernetes.io/part-of: concord
---
# Uygulama geneli ayarlar (secret OLMAYAN değerler)
apiVersion: v1
kind: ConfigMap
metadata:
  name: concord-config
  namespace: concord
data:
  NODE_ENV: 'production'
  API_PORT: '8080'
  REDIS_HOST: 'redis'
  REDIS_PORT: '6379'
  # CORS: prod'da gerçek origin allowlist (FAZ A: ALLOWED_ORIGINS)
  ALLOWED_ORIGINS: 'https://concord.example.com'
  PUBLIC_BASE_URL: 'https://concord.example.com'
  WEB_BASE_URL: 'https://concord.example.com'
  # Medya tarama (FAZ A internal/media.Scan)
  CLAMAV_ADDR: 'clamav:3310'
  # Voice kontrol
  VOICE_CONTROL_URL: 'http://voice:4444'
  # MinIO / obje deposu
  MINIO_ENDPOINT: 'minio:9000'
  MINIO_ACCESS_KEY: 'concord'
  MINIO_BUCKET: 'concord-uploads'
  SMTP_HOST: 'mailhog'
  SMTP_PORT: '1025'
