# Gözlemlenebilirlik: Prometheus (kazıma) + Grafana (dashboard)
# API pod'ları prometheus.io/scrape annotation'ı taşır (bkz. api.yaml) → otomatik keşif.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: concord
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        env: prod
    scrape_configs:
      # Pod'ları annotation'a göre otomatik keşfet (prometheus.io/scrape: "true")
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [concord] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: concord }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: concord-prometheus }
rules:
  - apiGroups: ['']
    resources: [pods, endpoints, services, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: concord-prometheus }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: concord-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: concord
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: concord
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: '1', memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {} # kalıcılık isteniyorsa PVC'ye çevir
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: concord }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: concord
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: concord
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: concord-secrets, key: GRAFANA_PASSWORD } }
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: concord }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: http }]
