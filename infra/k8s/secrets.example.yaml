# ŞABLON — gerçek değerlerle ASLA commit'leme.
# Üretimde `kubectl create secret` ile üret (bkz. README.md).
#
# ⚠️ API, dev-default secret ile başlamayı REDDEDER (config.MustSecure, FAZ A).
#    Bu değerler gerçek olmazsa pod CrashLoopBackOff'a düşer — bu KASITLI bir güvenlik kapısıdır.
apiVersion: v1
kind: Secret
metadata:
  name: concord-secrets
  namespace: concord
type: Opaque
stringData:
  # openssl rand -base64 48
  JWT_SECRET: "DEĞİŞTİR-guclu-rastgele-en-az-32-karakter"
  # Gateway'in Phoenix imzası (mix phx.gen.secret)
  SECRET_KEY_BASE: "DEĞİŞTİR-64-karakter-rastgele"
  # Voice ↔ API arası paylaşılan secret (x-voice-secret)
  VOICE_CONTROL_SECRET: "DEĞİŞTİR-rastgele"
  # MinIO → API medya webhook doğrulaması (FAZ A media_events)
  MEDIA_EVENT_SECRET: "DEĞİŞTİR-rastgele"
  # Tam DSN (kullanıcı+parola gömülü)
  POSTGRES_DSN: "postgres://concord:DEĞİŞTİR@postgres:5432/concord?sslmode=disable"
  POSTGRES_PASSWORD: "DEĞİŞTİR"
  MINIO_SECRET_KEY: "DEĞİŞTİR"
  # Grafana admin parolası (monitoring.yaml)
  GRAFANA_PASSWORD: "DEĞİŞTİR"
