# Concord Web — nginx (SPA + backend ters proxy)
#
# ÖNEMLİ: proxy_pass'te SABİT isim (proxy_pass http://api:8080) kullanılırsa nginx
# upstream'i AÇILIŞTA çözer ve çözemezse "[emerg] host not found in upstream" ile
# HİÇ BAŞLAMAZ — backend geç açıldığında/rolling deploy'da web tamamen ölür.
# Bu yüzden: resolver + DEĞİŞKENLİ proxy_pass → çözümleme İSTEK ANINDA yapılır,
# backend yokken bile nginx ayakta kalır (502 döner, ölmez).
#
# resolver, docker-entrypoint.d/19-resolver.sh tarafından /etc/resolv.conf'tan üretilip
# 00-resolver.conf'a yazılır (http seviyesi) → Docker ve k8s'te aynı imaj çalışır.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Güvenlik başlıkları (API kendi başlıklarını da ekler)
    include /etc/nginx/security-headers.inc;

    client_max_body_size 100m;  # presign upload limitiyle uyumlu

    # Hash'li varlıklar uzun cache; index.html asla cache'lenmez
    # DİKKAT: add_header tanımlayan her location, üstteki add_header'ları DÜŞÜRÜR →
    # güvenlik başlıklarını burada tekrar include etmek ZORUNLU.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }

    # REST API
    location /api/ {
        set $up_api http://api:8080;
        proxy_pass $up_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway WebSocket (Phoenix)
    location /socket/ {
        set $up_gw http://gateway:4000;
        proxy_pass $up_gw$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Voice signaling WebSocket — /voice-ws/ öneki soyulur
    location /voice-ws/ {
        set $up_vws http://voice:4443;
        rewrite ^/voice-ws/(.*)$ /$1 break;
        proxy_pass $up_vws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Voice presence/kontrol HTTP — /voice-api/ öneki soyulur
    location /voice-api/ {
        set $up_vapi http://voice:4444;
        rewrite ^/voice-api/(.*)$ /$1 break;
        proxy_pass $up_vapi;
        proxy_set_header Host $host;
    }

    # SPA fallback — bilinmeyen yollar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }
}
